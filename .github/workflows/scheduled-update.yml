name: 高频量化监控 · 每日定时刷新

# 更新计划：每日一次，09:30（北京时间）= 01:30 UTC
# 说明：本站数据由仓库外的抓取流程生成并写入 data.js；本工作流每天做两件事：
#       ① 校验 data.js 的数据新鲜度 ② 触发 Netlify 重新部署（需配置 NETLIFY_BUILD_HOOK）。
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-quant-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验 data.js 数据新鲜度
        run: |
          python -c "import re,pathlib;s=pathlib.Path('data.js').read_text(encoding='utf-8');m=re.search(r'生成时间：([0-9]{4}-[0-9]{2}-[0-9]{2})',s);print(m.group(1) if m else '未找到')" > fresh.txt
          echo "- data.js 生成时间：$(cat fresh.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 更新计划：每日 09:30（北京时间）" >> "$GITHUB_STEP_SUMMARY"

      - name: 触发 Netlify 重新部署
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::未配置 NETLIFY_BUILD_HOOK，跳过重新部署（页面保持当前版本）。"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "build hook HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Netlify build hook 调用失败（HTTP $code）"
            exit 1
          fi
